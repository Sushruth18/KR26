[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Logo copies from `npm run brand:images` — content-hashed names, so they never go stale.
[[headers]]
  for = "/brand/web/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Artist photo copies from `npm run brand:images` — content-hashed names too.
[[headers]]
  for = "/artist/web/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
